<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Magnos Lima — Full Stack Software Engineer</title>
  <desc id="desc">Banner profissional em azul e violeta destacando backend, APIs, cloud e inteligência artificial.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1024"/>
      <stop offset="0.52" stop-color="#20245c"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <g opacity="0.11" stroke="#ffffff">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M75 0V360M150 0V360M225 0V360M300 0V360M375 0V360M450 0V360M525 0V360M600 0V360M675 0V360M750 0V360M825 0V360M900 0V360M975 0V360M1050 0V360M1125 0V360"/>
  </g>

  <circle cx="1045" cy="75" r="170" fill="#22d3ee" opacity="0.17" filter="url(#glow)"/>
  <circle cx="1080" cy="300" r="145" fill="#8b5cf6" opacity="0.2" filter="url(#glow)"/>
  <path d="M925 99 864 180l61 81M1080 99l61 81-61 81M1018 78l-58 204" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>

  <rect x="70" y="58" width="8" height="241" rx="4" fill="url(#accent)"/>
  <text x="114" y="130" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="750">Magnos Lima</text>
  <text x="116" y="184" fill="#e0e7ff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="650">Full Stack Software Engineer</text>
  <text x="116" y="228" fill="#a5f3fc" font-family="Segoe UI, Arial, sans-serif" font-size="22">Backend · APIs · Cloud · AI Engineering</text>
  <text x="116" y="270" fill="#c7d2fe" font-family="Segoe UI, Arial, sans-serif" font-size="20">PHP/Laravel · Python/FastAPI · AWS · React/Vue.js</text>
  <rect x="114" y="294" width="394" height="34" rx="17" fill="#ffffff" opacity="0.1" stroke="#ffffff" stroke-opacity="0.22"/>
  <text x="132" y="317" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">3x AWS Certified · Sistemas para Internet — IFRN</text>
